spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
  sql:
    init:
      mode: never

app:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    default-bucket: ${MINIO_DEFAULT_BUCKET:living-frame}
    presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY:3600}
  ai:
    key-secret: ${AI_CONFIG_SECRET}
    memory:
      qdrant-url: ${QDRANT_URL}
  redisson:
    address: redis://${REDIS_HOST}:${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DATABASE:0}
  init:
    admin-password: ${INIT_ADMIN_PASSWORD}
    sysadmin-password: ${INIT_SYSADMIN_PASSWORD}
    viewer-password: ${INIT_VIEWER_PASSWORD}
    blacklist-password: ${INIT_BLACKLIST_PASSWORD}
    smoke-password: ${INIT_SMOKE_PASSWORD}
    business-password: ${INIT_BUSINESS_PASSWORD}
    cs-password: ${INIT_CS_PASSWORD}
